[project]
name = "shorts-clipper"
version = "0.1.0"
description = "Long-form video in, vertical Shorts out. Watchlist-driven, rights-gated, resumable."
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    # --- media ---
    "yt-dlp>=2025.1.15",
    "ffmpeg-python>=0.2.0",
    "scenedetect>=0.6.4",        # PySceneDetect: shot boundaries for reframe
    "opencv-python>=4.10.0",
    "mediapipe>=0.10.14",        # face detection for speaker tracking

    # --- models / APIs ---
    "google-genai>=1.0.0",       # Gemini: primary LLM provider + transcription
    "google-api-python-client>=2.150.0",  # YouTube Data + Analytics APIs
    "anthropic>=0.40.0",         # unused by the current router; see CLAUDE.md

    # --- core ---
    "pydantic>=2.9.0",
    "typer>=0.15.0",
    "rich>=13.9.0",
    "python-dotenv>=1.0.1",
    "pyyaml>=6.0.2",             # added: required to read config/*.yaml
    "httpx>=0.27.0",             # added: Groq + Ollama REST clients
    "flask>=3.0.0",              # the local review UI (Phase 4). Localhost only.
]

[project.scripts]
clipper = "clipper.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/clipper"]

[tool.ruff]
line-length = 100
target-version = "py311"
# ruff formats Python blocks inside Markdown as of 0.16, which means
# `ruff format .` rewrites the snippets in FULL_PLAN.md and WEB_UI_PLAN.md.
# Those are design documents: their code is illustration, wrapped to sit in
# prose, and not something the formatter should have an opinion about.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
