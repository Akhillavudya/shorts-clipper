# Rubric weights for the rerank pass (FULL_PLAN.md section 5).
#
# The model returns raw 1-10 scores per axis. The weighted sum is computed in
# Python, in moments/score.py - never by the model. That separation is what
# makes the calibration loop possible: the raw scores are archived in
# scored.json, so weights can be re-fit later without re-running any LLM call.
#
# These starting values are guesses. They are meant to be replaced.
# calibrate/analytics.py pulls real retention from the YouTube Analytics API
# and re-fits them; after ~50 published Shorts that fit is the project's actual
# edge over an off-the-shelf tool.

weights:
  # Does the first sentence stop a scroll on its own? Weighted hardest because
  # on Shorts nothing else matters if the first second fails.
  hook: 0.25

  # Does it make sense with zero context about the episode?
  self_containment: 0.20

  # Is there a resolution, not just a setup?
  payoff: 0.15

  # Is there a reason to feel something?
  surprise_emotion: 0.15

  # Does it work when the video is just a talking head?
  visual_independence: 0.05

  # Is there one line a viewer would repeat?
  quotability: 0.10

  # Natural boundary in the 25-55s range?
  length_fit: 0.10

# Applied after the weighted sum, in Python.
modifiers:
  # Clips outside the target length get scaled down rather than dropped, so a
  # great 70s moment can still surface for manual trimming.
  length_penalty:
    enabled: true
    under_min_s: 0.85
    over_max_s: 0.80

  # A clip whose span crosses a speaker change is harder to reframe cleanly.
  speaker_change_penalty: 0.95

# Candidates scoring below this are not shown for review at all.
min_score: 5.5

# How many clips to surface per source video. section 12 targets 1-3 Shorts/day.
max_clips_per_video: 3

calibration:
  # Set by calibrate/analytics.py when it last re-fit the weights above.
  # `clipper calibrate` rewrites only the numbers in this file, never the
  # comments - the comments are what make the weights mean anything.
  last_fit: null
  sample_size: 0
  # Retention metric the fit optimizes against.
  target_metric: average_view_percentage
  # Do not re-fit on a sample this small; the noise dominates.
  min_sample: 30
  # How far one fit moves the weights: 1.0 replaces them outright, 0.0 changes
  # nothing. Fifty noisy samples should nudge, not overwrite.
  learning_rate: 0.5
  # No axis is ever weighted below this. An axis weighted to zero stops
  # influencing which clips get rendered, so nothing that scores well on it is
  # ever published, so no evidence about it is ever collected again - the fit
  # would close that door permanently. The floor keeps every axis in the sample.
  weight_floor: 0.02
